# Render Blueprint Specification for PlanMyTrip Frontend
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: planmytrip-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # Single-Page Application (SPA) routing: rewrite all client requests to /index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_BASE_URL
        # Update this value to your live backend gateway URL on Render (e.g., https://planmytrip-backend.onrender.com)
        sync: false
